<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceiça Prado Maquiagem e Penteado - Agenda & Financeiro</title>
  <!-- Google Fonts: Playfair Display para luxo/destaque e Montserrat para leitura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --pink-main: #ff69b4;
      --pink-light: #fff0f6;
      --pink-hover: #ff4797;
      --pink-glow: rgba(255, 105, 180, 0.4);
      --black-main: #111111;
      --black-soft: #222222;
      --gold-accent: #d4af37;
      --whatsapp-green: #25d366;
      --whatsapp-dark: #128c7e;
      --white: #ffffff;
      --green-done: #2e7d32;
      --green-light: #e8f5e9;
      --purple-reminder: #8e44ad;
      --purple-hover: #732d91;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--pink-light);
      background-image: 
        linear-gradient(rgba(255, 240, 246, 0.90), rgba(255, 240, 246, 0.90)),
        url('https://img.freepik.com/free-vector/beauty-makeup-seamless-pattern-background_1284-52621.jpg');
      background-repeat: repeat;
      background-size: 350px;
      color: var(--black-main);
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-size: 16px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.98);
      border: 3px solid var(--black-main);
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(5px);
    }

    /* HEADER DESTACADO E ELEGANTE */
    header.header-destaque {
      text-align: center;
      margin-bottom: 25px;
      padding: 20px 15px;
      background: linear-gradient(135deg, #111111 0%, #222222 100%);
      border-radius: 18px;
      border: 2px solid var(--pink-main);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    header.header-destaque::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--pink-main), transparent);
    }

    .header-icon {
      font-size: 28px;
      margin-bottom: 4px;
      display: block;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      color: #ffffff;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      text-transform: uppercase;
      text-shadow: 0 2px 10px var(--pink-glow);
    }

    header p {
      font-family: 'Montserrat', sans-serif;
      color: var(--pink-light);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 3px;
      margin-top: 8px;
      text-transform: uppercase;
      border-top: 1px solid rgba(255, 105, 180, 0.3);
      display: inline-block;
      padding-top: 6px;
    }

    /* Card Financeiro */
    .finance-card {
      background: var(--black-main);
      color: var(--white);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 6px solid var(--pink-main);
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    .finance-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--pink-main);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .finance-value {
      font-size: 28px;
      font-weight: 700;
      color: #25d366;
      margin-top: 4px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 25px;
      background: var(--pink-light);
      padding: 22px;
      border-radius: 16px;
      border: 2px solid var(--pink-main);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 700;
      font-size: 15px;
      color: var(--black-soft);
    }

    input[type="text"], input[type="tel"], input[type="date"], input[type="time"] {
      padding: 14px;
      border: 2px solid var(--black-main);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: var(--white);
      font-weight: 500;
    }

    input:focus {
      border-color: var(--pink-main);
      box-shadow: 0 0 8px var(--pink-glow);
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--white);
      padding: 14px;
      border: 2px solid var(--black-main);
      border-radius: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--pink-main);
      cursor: pointer;
    }

    .valor-preview {
      font-weight: 700;
      color: var(--pink-hover);
      font-size: 15px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .desconto-tag {
      color: #2e7d32;
      font-size: 13px;
      font-weight: 700;
    }

    .btn-submit {
      background-color: var(--black-main);
      color: var(--pink-main);
      border: 2px solid var(--black-main);
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 5px;
    }

    .btn-submit:hover {
      background-color: var(--pink-hover);
      color: var(--white);
      border-color: var(--pink-hover);
      box-shadow: 0 4px 12px var(--pink-glow);
    }

    /* SEÇÃO DE BACKUP CONTROLS */
    .backup-section {
      background: var(--white);
      border: 2px dashed var(--black-main);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 25px;
      text-align: center;
    }

    .backup-section h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--black-main);
      margin-bottom: 6px;
    }

    .backup-section p {
      font-size: 13px;
      color: #666;
      margin-bottom: 14px;
    }

    .backup-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-backup {
      background: var(--black-main);
      color: var(--white);
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-backup:hover {
      background: var(--pink-hover);
    }

    .btn-restore {
      background: var(--pink-light);
      color: var(--black-main);
      border: 2px solid var(--black-main);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-block;
    }

    .btn-restore:hover {
      background: var(--black-main);
      color: var(--pink-main);
    }

    .agenda-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--black-main);
      border-left: 6px solid var(--pink-main);
      padding-left: 12px;
    }

    .search-container {
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--black-main);
      border-radius: 10px;
      font-size: 15px;
      background: var(--white);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--pink-main);
      box-shadow: 0 0 6px var(--pink-glow);
    }

    .agendamentos-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--white);
      border: 2px solid var(--black-main);
      border-left: 8px solid var(--pink-main);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .card.concluido {
      border-left-color: var(--green-done);
      background-color: var(--green-light);
      opacity: 0.9;
    }

    .card.concluido .card-cliente {
      text-decoration: line-through;
      color: var(--green-done);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-cliente {
      font-weight: 700;
      font-size: 18px;
      color: var(--black-main);
    }

    .card-servicos-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .card-servico {
      display: inline-block;
      background: var(--pink-light);
      color: var(--pink-hover);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--pink-main);
    }

    .card-valor {
      font-weight: 700;
      color: var(--green-done);
      font-size: 15px;
    }

    .card-desconto-tag {
      font-size: 11px;
      font-weight: 700;
      color: #2e7d32;
      background: #e8f5e9;
      border: 1px solid #2e7d32;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 2px;
    }

    .card-data {
      font-size: 14px;
      font-weight: 500;
      color: #555;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 130px;
    }

    .btn-concluir {
      background: var(--white);
      color: var(--green-done);
      border: 2px solid var(--green-done);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-concluir:hover, .card.concluido .btn-concluir {
      background: var(--green-done);
      color: var(--white);
    }

    .btn-whatsapp {
      background: var(--whatsapp-green);
      color: var(--white);
      border: 1px solid var(--whatsapp-dark);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-whatsapp:hover {
      background: var(--whatsapp-dark);
    }

    .btn-lembrete {
      background: var(--purple-reminder);
      color: var(--white);
      border: 1px solid var(--purple-hover);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-lembrete:hover {
      background: var(--purple-hover);
    }

    .btn-editar {
      background: transparent;
      color: var(--black-main);
      border: 1px solid var(--black-main);
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-editar:hover {
      background: var(--black-main);
      color: var(--pink-main);
    }

    .btn-deletar {
      background: transparent;
      color: #e74c3c;
      border: 1px solid #e74c3c;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-deletar:hover {
      background: #e74c3c;
      color: var(--white);
    }

    .empty-msg {
      text-align: center;
      color: #777;
      font-style: italic;
      font-size: 16px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Cabeçalho de Alto Destaque -->
    <header class="header-destaque">
      <span class="header-icon">💄✨</span>
      <h1>Ceiça Prado</h1>
      <p>Maquiagem & Penteado</p>
    </header>

    <!-- Resumo Financeiro -->
    <div class="finance-card">
      <div>
        <div class="finance-title">Faturamento Agendado</div>
        <div id="totalFinanceiro" class="finance-value">R$ 0,00</div>
      </div>
      <div style="font-size: 32px;">💰</div>
    </div>

    <form id="agendamentoForm">
      <input type="hidden" id="agendamentoId">

      <div class="form-group">
        <label for="cliente">Nome da Cliente</label>
        <input type="text" id="cliente" placeholder="Digite o nome da cliente" required>
      </div>

      <div class="form-group">
        <label for="celular">Celular / WhatsApp (Com DDD)</label>
        <input type="tel" id="celular" placeholder="(88) 99999-9999">
      </div>

      <div class="form-group">
        <label>Serviços (Selecione um ou mais)</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" name="servicos" value="Maquiagem" data-valor="80"> Maquiagem (R$ 80,00)
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="servicos" value="Penteado" data-valor="80"> Penteado (R$ 80,00)
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="servicos" value="Waves" data-valor="50"> Waves (R$ 50,00)
          </label>
        </div>
        <div id="valorCalculadoPreview" class="valor-preview">
          <span id="textoValorTotal">Valor total selecionado: R$ 0,00</span>
          <span id="textoDesconto" class="desconto-tag"></span>
        </div>
      </div>

      <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label for="data">Data</label>
          <input type="date" id="data" required>
        </div>
        <div style="flex: 1;">
          <label for="hora">Horário</label>
          <input type="time" id="hora" required>
        </div>
      </div>

      <button type="submit" id="btnSalvar" class="btn-submit">Agendar Horário</button>
    </form>

    <!-- SEÇÃO DE SALVAR E RESTAURAR DADOS PARA TROCAR DE CELULAR -->
    <div class="backup-section">
      <h3>💾 Troca de Celular / Backup dos Agendamentos</h3>
      <p>Salve a lista em um arquivo no seu celular atual e abra no novo celular sem perder nenhum agendamento!</p>
      <div class="backup-buttons">
        <button type="button" class="btn-backup" onclick="exportarDados()">📥 Salvar Backup (Baixar)</button>
        <label class="btn-restore">
          📤 Restaurar Backup
          <input type="file" id="importFile" accept=".json" onchange="importarDados(event)" style="display: none;">
        </label>
      </div>
    </div>

    <div class="agenda-section">
      <h2>Meus Agendamentos</h2>
      
      <div class="search-container">
        <input type="text" id="inputPesquisa" class="search-input" placeholder="🔍 Pesquisar por nome ou data (ex: Maria ou 25/08)...">
      </div>

      <div id="listaAgendamentos" class="agendamentos-list">
        <!-- Os agendamentos aparecerão aqui -->
      </div>
    </div>
  </div>

  <script>
    const PRECOS_SERVICOS = {
      'Maquiagem': 80,
      'Penteado': 80,
      'Waves': 50
    };

    const form = document.getElementById('agendamentoForm');
    const listaAgendamentos = document.getElementById('listaAgendamentos');
    const agendamentoIdInput = document.getElementById('agendamentoId');
    const btnSalvar = document.getElementById('btnSalvar');
    const inputPesquisa = document.getElementById('inputPesquisa');
    const totalFinanceiroEl = document.getElementById('totalFinanceiro');
    const textoValorTotal = document.getElementById('textoValorTotal');
    const textoDesconto = document.getElementById('textoDesconto');

    document.addEventListener('DOMContentLoaded', () => {
      carregarAgendamentos();
      atualizarPreviewValor();
    });

    inputPesquisa.addEventListener('input', carregarAgendamentos);

    document.querySelectorAll('input[name="servicos"]').forEach(cb => {
      cb.addEventListener('change', atualizarPreviewValor);
    });

    function calcularValorDosServicos(servicos) {
      if (!servicos || servicos.length === 0) return 0;
      
      let soma = servicos.reduce((acc, s) => acc + (PRECOS_SERVICOS[s] || 0), 0);
      
      if (servicos.length > 1) {
        soma -= 10;
      }
      
      return soma;
    }

    function atualizarPreviewValor() {
      const checkboxes = document.querySelectorAll('input[name="servicos"]:checked');
      const servicos = Array.from(checkboxes).map(cb => cb.value);
      const valorTotal = calcularValorDosServicos(servicos);
      
      textoValorTotal.textContent = `Valor total selecionado: ${formatarMoeda(valorTotal)}`;
      
      if (servicos.length > 1) {
        textoDesconto.textContent = "💖 Desconto de R$ 10,00 aplicado com carinho pelo seu combo!";
      } else {
        textoDesconto.textContent = "";
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const id = agendamentoIdInput.value;
      const cliente = document.getElementById('cliente').value;
      const celular = document.getElementById('celular').value;
      const data = document.getElementById('data').value;
      const hora = document.getElementById('hora').value;

      const checkboxes = document.querySelectorAll('input[name="servicos"]:checked');
      const servicos = Array.from(checkboxes).map(cb => cb.value);

      if (servicos.length === 0) {
        alert('Por favor, selecione pelo menos um serviço!');
        return;
      }

      const valor = calcularValorDosServicos(servicos);

      let agendamentos = obterAgendamentos();

      if (id) {
        agendamentos = agendamentos.map(item => {
          if (item.id === Number(id)) {
            return { ...item, cliente, celular, valor, servicos, data, hora };
          }
          return item;
        });
        agendamentoIdInput.value = '';
        btnSalvar.textContent = 'Agendar Horário';
      } else {
        const novoAgendamento = {
          id: Date.now(),
          cliente,
          celular,
          valor,
          servicos,
          data,
          hora,
          concluido: false
        };
        agendamentos.push(novoAgendamento);
      }

      agendamentos.sort((a, b) => new Date(`${a.data}T${a.hora}`) - new Date(`${b.data}T${b.hora}`));
      localStorage.setItem('ceica_prado_agendamentos', JSON.stringify(agendamentos));

      form.reset();
      atualizarPreviewValor();
      carregarAgendamentos();
    });

    function obterAgendamentos() {
      const agendamentos = localStorage.getItem('ceica_prado_agendamentos');
      return agendamentos ? JSON.parse(agendamentos) : [];
    }

    function alternarStatusConcluido(id) {
      let agendamentos = obterAgendamentos();
      agendamentos = agendamentos.map(item => {
        if (item.id === id) {
          return { ...item, concluido: !item.concluido };
        }
        return item;
      });
      localStorage.setItem('ceica_prado_agendamentos', JSON.stringify(agendamentos));
      carregarAgendamentos();
    }

    function editarAgendamento(id) {
      const agendamentos = obterAgendamentos();
      const item = agendamentos.find(a => a.id === id);

      if (item) {
        agendamentoIdInput.value = item.id;
        document.getElementById('cliente').value = item.cliente;
        document.getElementById('celular').value = item.celular || '';
        document.getElementById('data').value = item.data;
        document.getElementById('hora').value = item.hora;

        document.querySelectorAll('input[name="servicos"]').forEach(cb => cb.checked = false);

        const servicosSalvos = Array.isArray(item.servicos) ? item.servicos : [item.servico];
        servicosSalvos.forEach(s => {
          const checkbox = document.querySelector(`input[name="servicos"][value="${s}"]`);
          if (checkbox) checkbox.checked = true;
        });

        atualizarPreviewValor();
        btnSalvar.textContent = 'Atualizar Agendamento';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function deletarAgendamento(id) {
      let agendamentos = obterAgendamentos();
      agendamentos = agendamentos.filter(item => item.id !== id);
      localStorage.setItem('ceica_prado_agendamentos', JSON.stringify(agendamentos));
      carregarAgendamentos();
    }

    function formatarData(dataString) {
      const [ano, mes, dia] = dataString.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    function formatarMoeda(valor) {
      return (valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function abrirWhatsappURL(celular, mensagem) {
      let url = '';
      if (celular && celular.trim() !== '') {
        let numLimpo = celular.replace(/\D/g, '');
        if (!numLimpo.startsWith('55')) {
          numLimpo = '55' + numLimpo;
        }
        url = `https://api.whatsapp.com/send?phone=${numLimpo}&text=${mensagem}`;
      } else {
        url = `https://api.whatsapp.com/send?text=${mensagem}`;
      }
      window.open(url, '_blank');
    }

    // MENSAGEM 1: CONFIRMAÇÃO DE AGENDAMENTO (AO MARCAR)
    function enviarWhatsApp(id) {
      const agendamentos = obterAgendamentos();
      const item = agendamentos.find(a => a.id === id);
      if (!item) return;

      const dataFormatada = formatarData(item.data);
      const servicosLista = Array.isArray(item.servicos) ? item.servicos : [item.servico];

      let servicosTexto = servicosLista.length === 1 
        ? servicosLista[0] 
        : '%0A' + servicosLista.map(s => `  ✨ ${s}`).join('%0A');

      const mensagem = `Olá, ${item.cliente}! 💕✨%0A%0AÉ um prazer ter você conosco! Confirmando o seu agendamento em *Ceiça Prado - Maquiagem %26 Penteado*:%0A%0A💄 *Serviço(s):* ${servicosTexto}%0A🗓️ *Data:* ${dataFormatada}%0A⏰ *Horário:* ${item.hora}%0A📍 *Endereço:* Rua Sancho Canafistula, nº 114, Bairro Alto do Cristo%0A%0AEstou preparando tudo para te deixar ainda mais linda! Se precisar de algo, é só avisar. Até logo! 💖👑`;

      abrirWhatsappURL(item.celular, mensagem);
    }

    // MENSAGEM 2: LEMBRETE DE CONFIRMAÇÃO DO DIA (SEM DICAS)
    function enviarLembreteWhatsApp(id) {
      const agendamentos = obterAgendamentos();
      const item = agendamentos.find(a => a.id === id);
      if (!item) return;

      const dataFormatada = formatarData(item.data);
      const servicosLista = Array.isArray(item.servicos) ? item.servicos : [item.servico];

      let servicosTexto = servicosLista.length === 1 
        ? servicosLista[0] 
        : '%0A' + servicosLista.map(s => `  ✨ ${s}`).join('%0A');

      const mensagem = `Olá, ${item.cliente}! 💕✨%0A%0APassando para lembrar do seu agendamento em *Ceiça Prado - Maquiagem %26 Penteado*:%0A%0A💄 *Serviço(s):* ${servicosTexto}%0A🗓️ *Data:* ${dataFormatada}%0A⏰ *Horário:* ${item.hora}%0A📍 *Endereço:* Rua Sancho Canafistula, nº 114, Bairro Alto do Cristo%0A%0AQualquer dúvida ou imprevisto, é só me avisar aqui. Estou te esperando para te deixar ainda mais maravilhosa! 💖👑`;

      abrirWhatsappURL(item.celular, mensagem);
    }

    function calcularTotalFinanceiro(agendamentos) {
      const total = agendamentos.reduce((acc, item) => {
        const v = item.valor !== undefined ? item.valor : calcularValorDosServicos(item.servicos || []);
        return acc + (parseFloat(v) || 0);
      }, 0);
      totalFinanceiroEl.textContent = formatarMoeda(total);
    }

    function carregarAgendamentos() {
      const agendamentos = obterAgendamentos();
      const termo = inputPesquisa ? inputPesquisa.value.toLowerCase().trim() : '';
      listaAgendamentos.innerHTML = '';

      calcularTotalFinanceiro(agendamentos);

      const agendamentosFiltrados = agendamentos.filter(item => {
        const nomeCliente = item.cliente.toLowerCase();
        const dataFormatada = formatarData(item.data);
        const dataOriginal = item.data;

        return nomeCliente.includes(termo) || 
               dataFormatada.includes(termo) || 
               dataOriginal.includes(termo);
      });

      if (agendamentosFiltrados.length === 0) {
        if (termo !== '') {
          listaAgendamentos.innerHTML = '<p class="empty-msg">Nenhum agendamento encontrado para esta pesquisa.</p>';
        } else {
          listaAgendamentos.innerHTML = '<p class="empty-msg">Nenhum agendamento marcado ainda.</p>';
        }
        return;
      }

      agendamentosFiltrados.forEach(item => {
        const card = document.createElement('div');
        const estaConcluido = item.concluido ? 'concluido' : '';
        card.className = `card ${estaConcluido}`;

        const celularDisplay = item.celular && item.celular.trim() !== '' 
          ? `<span class="card-data">📱 ${item.celular}</span>` 
          : '';

        const servicosLista = Array.isArray(item.servicos) ? item.servicos : [item.servico];
        const servicosHTML = servicosLista.map(s => `<span class="card-servico">${s}</span>`).join('');
        const textoBtnConcluir = item.concluido ? '✓ Realizado' : 'Marcar Concluído';
        const valorCard = item.valor !== undefined ? item.valor : calcularValorDosServicos(servicosLista);

        const temDesconto = servicosLista.length > 1;
        const tagDescontoHTML = temDesconto 
          ? `<span class="card-desconto-tag">💖 Desconto Combo R$ 10,00 aplicado</span>` 
          : '';

        card.innerHTML = `
          <div class="card-info">
            <span class="card-cliente">${item.cliente}</span>
            <div class="card-servicos-container">
              ${servicosHTML}
            </div>
            <span class="card-data">🗓️ ${formatarData(item.data)} às ⏰ ${item.hora}</span>
            <span class="card-valor">💵 ${formatarMoeda(valorCard)}</span>
            ${tagDescontoHTML}
            ${celularDisplay}
          </div>
          <div class="card-actions">
            <button class="btn-concluir" onclick="alternarStatusConcluido(${item.id})">${textoBtnConcluir}</button>
            <button class="btn-whatsapp" onclick="enviarWhatsApp(${item.id})">📲 Agendamento</button>
            <button class="btn-lembrete" onclick="enviarLembreteWhatsApp(${item.id})">🔔 Lembrete Dia</button>
            <button class="btn-editar" onclick="editarAgendamento(${item.id})">Editar</button>
            <button class="btn-deletar" onclick="deletarAgendamento(${item.id})">Cancelar</button>
          </div>
        `;
        listaAgendamentos.appendChild(card);
      });
    }

    /* FUNÇÕES DE BACKUP / IMPORTAR E EXPORTAR DADOS */
    function exportarDados() {
      const agendamentos = obterAgendamentos();
      if (agendamentos.length === 0) {
        alert('Não há agendamentos salvos para exportar!');
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(agendamentos, null, 2));
      const downloadAnchor = document.createElement('a');
      const hoje = new Date().toISOString().split('T')[0];
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `backup_ceica_prado_${hoje}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importarDados(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const dados = JSON.parse(e.target.result);
          if (Array.isArray(dados)) {
            if (confirm(`Deseja importar ${dados.length} agendamento(s)? Isso atualizará sua lista atual.`)) {
              localStorage.setItem('ceica_prado_agendamentos', JSON.stringify(dados));
              carregarAgendamentos();
              alert('✨ Agendamentos restaurados com sucesso!');
            }
          } else {
            alert('Arquivo inválido! Certifique-se de escolher o arquivo de backup gerado pelo aplicativo.');
          }
        } catch (err) {
          alert('Erro ao ler o arquivo de backup!');
        }
      };
      reader.readAsText(file);
    }
  </script>
